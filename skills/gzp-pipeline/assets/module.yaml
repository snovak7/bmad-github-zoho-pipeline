code: gzp
name: "Pipeline Forge"
description: "Configurable Zoho Projects / Windshift + GitHub Flow task pipeline: plans, tracks, and time-logs work in Zoho Projects or Windshift (optional per project), drives implementation tasks through GitHub Flow on GitHub or Forgejo (via MCP or the gh/fj CLI) per repo config — issue-first flow, GPG enforcement, and PR auto-merge each a setup toggle — and handles ad hoc forge issues as standalone reporting artifacts."
module_version: 1.6.0
default_selected: false
module_greeting: >
  Pipeline Forge is ready. Say "start a new phase" to break your next chunk of work into a
  tracked phase list, or "work the next task" to pick up where you left off — with a tracker
  configured, every segment gets its own time-log session; resume always reads
  session-state.json first.

  Run this again any time with `configure` to reconfigure, or edit _bmad/config.yaml /
  config.user.yaml directly.

gzp_tracker:
  prompt: >
    Which tracker should hold this repo's work items, statuses, and time logs? (With "none",
    the pipeline drives GitHub Flow only: no tracker tasks, statuses, or time logs. Pairing
    that with the issue-first option below is then recommended, so each task still has a
    durable record.)
  default: "zoho"
  single-select:
    - value: "zoho"
      label: "Zoho Projects (via its MCP server)"
    - value: "windshift"
      label: "Windshift (via its built-in MCP server)"
    - value: "none"
      label: "None: GitHub Flow only"

gzp_zoho_mcp_name:
  prompt: "Which Zoho Projects MCP server should this pipeline use for tasks and time-logging? (must expose time-log tools, e.g. add_time_log/update_single_time_log)"
  default: ""
  required: true
  user_setting: true
  asked_when: "gzp_tracker == zoho"

gzp_zoho_project_name:
  prompt: "What is the Zoho Projects project name that this repo's work should be tracked against?"
  default: ""
  required: true
  asked_when: "gzp_tracker == zoho"

gzp_default_bill_status:
  prompt: "Default bill_status for time-log entries this pipeline creates (e.g. 'Non Billable', 'Billable')?"
  default: "Non Billable"
  asked_when: "gzp_tracker == zoho"

gzp_windshift_mcp_name:
  prompt: "Which Windshift MCP server should this pipeline use for work items and time logging? (the server name as your client lists it; it's your instance's /mcp endpoint)"
  default: ""
  required: true
  user_setting: true
  asked_when: "gzp_tracker == windshift"

gzp_windshift_workspace_name:
  prompt: "What is the Windshift workspace that this repo's work should be tracked in?"
  default: ""
  required: true
  asked_when: "gzp_tracker == windshift"

gzp_windshift_time_project:
  prompt: >
    Which Windshift time project should time be booked against? Leave the default to use the
    time project linked to the workspace, which is the usual setup.
  default: ""
  asked_when: "gzp_tracker == windshift"

gzp_forge:
  prompt: "Which forge hosts this repo's issues and PRs?"
  default: "github"
  single-select:
    - value: "github"
      label: "GitHub (gh CLI or a GitHub MCP server)"
    - value: "forgejo"
      label: "Forgejo, e.g. Codeberg or self-hosted (fj CLI or a Forgejo MCP server)"

gzp_forge_tool:
  prompt: >
    How should the pipeline talk to the forge for issues, PRs, and merges: through an MCP
    server connected in your client, or the forge's CLI (gh for GitHub, fj for Forgejo)?
    The choice is strict: if the chosen tool isn't available, the pipeline stops and says
    so instead of silently switching to the other.
  default: "mcp"
  single-select:
    - value: "mcp"
      label: "MCP server (named in the next question)"
    - value: "cli"
      label: "CLI (gh / fj, installed and authenticated)"
  user_setting: true

gzp_forge_mcp_name:
  prompt: "Which MCP server should the pipeline use for the forge? (the server name as your client lists it)"
  default: ""
  required: true
  user_setting: true
  asked_when: "gzp_forge_tool == mcp"

gzp_gpg_signing:
  prompt: >
    Require GPG-signed commits as a hard checkpoint — every commit verified via
    'git log --show-signature' before proceeding? (When off, commits are made with the
    repo's existing git config as-is; signing is neither enforced nor disabled.)
  default: true

gzp_auto_merge_pr:
  prompt: >
    Automatically merge PRs the pipeline opens instead of waiting for your manual review
    and merge? (Blocked merges — failing checks, required reviews, conflicts — always fall
    back to waiting; nothing is ever forced.)
  default: false

gzp_issue_first:
  prompt: >
    Create a tracking issue first for every code-change task — opened before branching, linked
    from the branch and PR, and auto-closed by the merge? (When off, tasks go straight to
    branch and PR.)
  default: true

gzp_autotrack_bmad_build:
  prompt: >
    Automatically track bmad-build work through Pipeline Forge — task status, time-log
    sessions, and the GitHub Flow handoff — without ever needing to say "gzp-pipeline"? This
    writes hooks into _bmad/custom/bmad-build.toml (activation_steps_prepend + on_complete) if
    bmad-build is installed in this project; skipped otherwise, and safe to answer yes even if
    you later add bmad-build.
  default: true

gzp_autotrack_bmad_loop:
  prompt: >
    Also track the unattended development loop (bmad-build-auto) through Pipeline Forge? The
    loop reads its own override file, so without this it skips the pipeline entirely. This
    writes unattended hooks into _bmad/custom/bmad-build-auto.toml: the pipeline never asks
    questions or waits for a human there.
  default: true

gzp_loop_auto_merge_pr:
  prompt: >
    In the unattended loop, let the pipeline accept (merge) the PRs it opens by itself, so
    iterations flow without you? (Independent of the interactive auto-merge answer above.
    Only merges its own PR once checks are green; a blocked merge leaves the PR open and the
    loop halts as blocked. When off, every iteration ends with its PR open for you to merge.)
  default: true
  asked_when: gzp_autotrack_bmad_loop

directories:
  - "{project-root}/_bmad/memory/gzp-pipeline"
