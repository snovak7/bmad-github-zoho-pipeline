document_output_language: English
output_folder: '{project-root}/_bmad-output'
bmb:
  name: BMad Builder
  description: Standard Skill Compliant Factory for BMad Agents, Workflows and Modules
  version: 1.0.0
  default_selected: false
  bmad_builder_output_folder: '{project-root}/skills'
  bmad_builder_reports: '{project-root}/skills/reports'
gzp:
  name: Pipeline Forge
  description: 'Configurable Zoho Projects / Windshift + GitHub Flow task pipeline:
    plans, tracks, and time-logs work in Zoho Projects or Windshift (optional per
    project), drives implementation tasks through GitHub Flow on GitHub or Forgejo
    (via MCP or the gh/fj CLI) per repo config — issue-first flow, GPG enforcement,
    and PR auto-merge each a setup toggle — and handles ad hoc forge issues as standalone
    reporting artifacts.'
  version: 1.6.1
  default_selected: false
  gzp_tracker: zoho
  gzp_zoho_project_name: NE-4
  gzp_default_bill_status: Non Billable
  gzp_forge: github
  gzp_gpg_signing: true
  gzp_auto_merge_pr: false
  gzp_issue_first: true
  gzp_autotrack_bmad_build: true
  gzp_autotrack_bmad_loop: true
  gzp_loop_auto_merge_pr: true
